<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1200" viewBox="0 0 2000 1200">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#7c3aed"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <style>
      .title { font: 700 38px Arial, sans-serif; fill: #111827; }
      .subtitle { font: 400 18px Arial, sans-serif; fill: #64748b; }
      .section { font: 700 20px Arial, sans-serif; fill: #111827; letter-spacing: 1px; }
      .boxTitle { font: 700 24px Arial, sans-serif; fill: #111827; }
      .boxText { font: 400 18px Arial, sans-serif; fill: #475569; }
      .smallTitle { font: 700 21px Arial, sans-serif; fill: #111827; }
      .smallText { font: 400 16px Arial, sans-serif; fill: #475569; }
      .iconText { font: 700 16px Arial, sans-serif; fill: #0f172a; }
      .label { font: 400 16px Arial, sans-serif; fill: #334155; }
      .note { font: 600 15px Arial, sans-serif; fill: #334155; }
      .line { fill: none; stroke: #64748b; stroke-width: 2.5; marker-end: url(#arrow); }
      .lineBlue { fill: none; stroke: #2563eb; stroke-width: 2.8; marker-end: url(#arrowBlue); }
      .linePurple { fill: none; stroke: #7c3aed; stroke-width: 3; marker-end: url(#arrowPurple); }
      .dashed { stroke-dasharray: 10 8; }
    </style>
  </defs>

  <rect width="2000" height="1200" fill="#f8fafc"/>
