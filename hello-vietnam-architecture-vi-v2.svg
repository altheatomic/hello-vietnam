  <g><rect x="1485" y="675" width="268" height="42" rx="10" fill="#fff" stroke="#c4b5fd"/><text x="1510" y="702" class="note">CF Retrain · asyncpg trực tiếp</text></g>

  <text x="75" y="1175" class="subtitle">Nét liền: luồng đồng bộ · Nét đứt: luồng bất đồng bộ, nền hoặc dự kiến tích hợp</text>
