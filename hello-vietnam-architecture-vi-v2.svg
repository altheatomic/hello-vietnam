  <g filter="url(#shadow)"><rect x="880" y="940" width="180" height="150" rx="18" fill="#fff" stroke="#fb7185" stroke-width="2"/><text x="895" y="978" class="smallTitle">OpenStreetMap</text><text x="915" y="1010" class="smallText">Bản đồ và định vị</text></g>
  <g filter="url(#shadow)"><rect x="1080" y="940" width="180" height="150" rx="18" fill="#fff" stroke="#fb7185" stroke-width="2"/><text x="1137" y="978" class="smallTitle">Stripe</text><text x="1107" y="1010" class="smallText">Thanh toán gói</text><text x="1138" y="1034" class="smallText">đăng ký</text></g>
  <g filter="url(#shadow)"><rect x="1280" y="940" width="180" height="150" rx="18" fill="#fff" stroke="#fb7185" stroke-width="2"/><text x="1325" y="978" class="smallTitle">API tỷ giá</text><text x="1324" y="1010" class="smallText">Tỷ giá tiền tệ</text></g>

